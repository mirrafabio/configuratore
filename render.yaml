services:
  - type: web
    name: fleet-manager
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: "./build.sh"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: TELTONIKA_TCP_ENABLED
        value: "false"
      - key: PYTHON_VERSION
        value: "3.12.0"
    healthCheckPath: /health
