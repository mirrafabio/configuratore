services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
      - "5027:5027"   # Teltonika TCP port
    volumes:
      - fleet-data:/app/data
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/fleet.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  fleet-data:
